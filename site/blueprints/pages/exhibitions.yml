title: Exhibitions

columns:
  main_1:
    width: 2/3
    sections:
      pages:
        headline: Exhibitions
        type: pages
        image: icon
        templates:
          - exhibition
      main_fields:
        type: fields
        fields:
          shelf:
            label: Shelf
            type: pages
            query: page.children
            text: "{{ page.title }}"
            empty: No related posts found
            sortBy: date desc
            layout: cards
            size: small
            info: "{{ page.date }}"
  main_2:
    width: 1/3
    sections:
      fields:
        fields:
          main_content:
            label: Header
            type: textarea
            size: large
          color:
            label: Color
            type: color
            default: "#000"
      files:
        headline: Files
        type: files
        template: image
