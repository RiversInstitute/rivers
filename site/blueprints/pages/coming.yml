title: Coming


tabs:
  content:
    label: Content
    icon: text
    columns:
      # main content
      - width: 2/3
        sections:
          content:
            type: fields
            fields:
              intro_content:
                label: Intro Content
                type: textarea
                size: large
              participants_heading:
                label: Participants Heading
                type: text
                default: Participants
              participants:
                label: Participants
                type: structure
                fields:
                  name:
                    type: text
                    label: Name
                  color:
                    label: Color
                    type: color
                    default: "#cccccc"
                  bio:
                    label: Bio
                    type: textarea
                    size: small
                  page_link:
                    label: Link to page
                    type: multiselect
                    options: query
                    query: site.index
                    label: Page
                    max: 1
              images_heading:
                label: Images Section Heading
                type: text
                default: Images
              main_gallery:
                label: Gallery
                type: files
                layout: cards
                info: "{{file.caption}}"
              materials_heading:
                label: Materials Heading
                type: text
                default: Place
              materials:
                label: Materials
                type: files
              sources_heading:
                label: Sources Heading
                type: text
                default: Sources
              sources:
                label: Sources
                type: structure
                fields:
                  citation:
                    type: textarea
                    size: tiny
                    label: Citation
      # sidebar
      - width: 1/3
        sections:
          fields_1:
            type: fields
            fields:
              subpages_heading:
                label: Subpages Heading
                type: text
                default: Subpages
          pages:
            label: Subpages
            type: pages
            image: icon
            templates:
              - coming-subpage
          fields_2:
            type: fields
            fields:
              line:
                type: line
              color:
                label: Color
                type: color
                default: "#cccccc"
              cover_image:
                label: Cover Image
                type: files
                max: 1
              navigation:
                type: structure
                label: Navigation Links
                fields:
                  title:
                    type: text
                    label: Title
                  url:
                    type: text
                    label: Link

  files:
    label: Files
    icon: image
    sections:
      files:
        type: files
        layout: cards
        info: "{{ file.caption }}"
