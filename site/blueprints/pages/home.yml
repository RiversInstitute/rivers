title: Home

fields:
  ticker_content:
    label: Ticker
    type: text
    size: small
    maxlength: 220
  # ticker_url:
  #   label: Ticker URL
  #   type: text
  #   width: 1/4
  #   help: Leave empty for no url
  takeover:
    label: Takeover
    type: toggle
    width: 1/4
  takeover_iframe_url:
    label: Takeover IFrame URL
    type: text
    width: 3/4
  entries:
    label: Entries
    type: structure
    max: 6
    fields:
      title:
        type: textarea
        size: small
      blurb:
        label: Ticker Blurb
        type: text
        maxlength: 220
      # hero_image:
      #   label: Preview Image
      #   type: files
      #   max: 1
      block_color:
        required: true
        type: color
        label: Block Color
        width: 1/2
      # hover_color:
      #   required: true
      #   type: color
      #   label: Text Hover Color
      #   width: 1/2
      links_to:
        type: radio
        label: Links to
        default: page
        options:
          page: Page
          url: URL
      page_link:
        type: pages
        options: query
        query: site.index
        label: Page
        max: 1
        when:
          links_to: page
      url_link:
        type: url
        label: URL
        when:
          links_to: url
      image_on_hover:
        label: Image on hover
        type: toggle

  bibliography_item:
    label: Bibliography (deprecated)
    type: structure
    fields:
      citation:
        type: textarea
        size: tiny
        label: Citation
      embed:
        type: text
        label: HTML Embed Code
