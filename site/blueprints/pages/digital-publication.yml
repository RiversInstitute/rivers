title: Digital Publication
preset: page

pages:
  templates:
    - origin__3_harryette_mullen
    - origin__4_sanford_biggers_codeswitch
    - origin__5_john_jennings
    - origin__6_elena_del_rivero
    - origin__7_laura_mullen
    - origin__8_elinor_carucci
    - origin__9_weber_payton
    - 2__1_caroline_bergvall
    - 2__2_edwards

fields:
  publication_title:
    label: Full title
    type: textarea
    size: tiny
    uploads: false
    buttons:
      - bold
      - italic
      - link
  # publication_type:
  #   label: Type of publication
  #   type: radio
  #   default: physical
  #   options:
  #     physical: Physical
  #     digital: Digital
  digital_publication_page:
    label: Link to digital publication
    type: select
    options: query
    query: page.children
    when:
      publication_type: digital
  price:
    label: Price
    type: text
    width: 1/3
    when:
      publication_type: physical
  purchase_url:
    label: Purchase URL
    type: text
    width: 1/3
    when:
      publication_type: physical
  metadata:
    label: Metadata
    type: textarea
    width: 1/3
    when:
      publication_type: physical
  publication_images:
    label: Images
    type: files
  reviews:
    label: Reviews
    type: textarea
    size: medium
  main_content:
    label: Content
    type: textarea
    size: large
  credits:
    label: Credits
    type: textarea
    size: medium