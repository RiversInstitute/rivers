title: Artist

tabs:
  content:
    label: Content
    icon: text
    columns:
      # main content
      - width: 2/3
        sections:
          content:
            type: fields
            fields:
              hero_image:
                label: Hero image
                type: files
                max: 1
              preview_content:
                label: Preview Content
                type: textarea
                size: medium
              main_content:
                label: Content
                type: textarea
                size: large

      # sidebar
      - width: 1/3
        sections:
        #   pages:
        #     type: pages
        #     headline: Pages
        #     template: default
          fields:
            type: fields
            fields:
              part_of:
                type: pages
                label: Part of
                query: site.index
                text: "{{ page.title }}"
                empty: No related posts found
                sortBy: date desc
              works:
                type: files
                label: Works
                layout: list
                info: "{{file.caption}}"
              epherma:
                type: files
                label: Epherma
                layout: list
                info: "{{file.caption}}"
              footnotes:
                type: structure
                headline: Footnotes
                fields:
                  text:
                    label: Footnote
                    type: textarea
                    size: medium
              color:
                label: Color
                type: color
                default: "#ff6253"
                    
                    

  files:
    label: Files
    icon: image
    sections:
      files:
        type: files
        layout: list